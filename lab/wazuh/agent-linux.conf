<!--
  Add these blocks inside <ossec_config> in /var/ossec/etc/ossec.conf on the Ubuntu EHR VM,
  then: sudo systemctl restart wazuh-agent
-->

<!-- Ship the EHR audit log (one JSON object per line) -->
<localfile>
  <log_format>json</log_format>
  <location>/var/log/aurelia-ehr/access.log</location>
</localfile>

<!-- Real-time file integrity monitoring of the patient record store -->
<syscheck>
  <directories realtime="yes" check_all="yes" report_changes="no">/srv/ehr/records</directories>
</syscheck>
